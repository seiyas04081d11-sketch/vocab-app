<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="単語帳">
<meta name="theme-color" content="#1f3a5f">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
<title>英単語帳</title>
</head>
<body>
<header><h1 id="title">英単語帳</h1><button id="back" hidden>←</button></header>
<main>
  <section id="home">
    <div class="stats">
      <div><span id="sDue">0</span><small>今日の復習</small></div>
      <div><span id="sNew">0</span><small>新しい単語</small></div>
      <div><span id="sAll">0</span><small>全単語</small></div>
    </div>
    <button class="primary" id="startBtn">学習を始める</button>
    <p class="hint" id="doneMsg" hidden>今日の分はおわりです。明日また出題されます。</p>
    <label class="row small">1日の新しい単語 <input id="newLimit" type="number" min="0" max="200"> 語</label>
    <hr>
    <label class="file">単語リスト(CSV)を読み込む<input id="csv" type="file" accept=".csv,text/csv"></label>
    <button id="reset">サンプルに戻す</button>
    <button id="clearProgress">学習記録をリセット</button>
    <p class="hint">CSVの列: no, word, pos, meaning, cue, example_en, example_ja, note, related, memo, ja_note</p>
  </section>

  <section id="study" hidden>
    <div class="progress" id="prog"></div>
    <div id="card">
      <div class="meta"><span id="cNo"></span><span id="cTag" class="tag"></span></div>
      <div class="word" id="cWord"></div>
      <div class="cue" id="cCue"></div>
      <div id="hints">
        <div class="ex hint1" id="hEn" hidden></div>
        <div class="ex ja hint2" id="hJa" hidden></div>
      </div>
      <div id="answer" hidden>
        <div class="pos" id="aPos"></div>
        <div class="meaning" id="aMeaning"></div>
        <div class="janote" id="aJaNote"></div>
        <div class="ex" id="aEn"></div>
        <div class="ex ja" id="aJa"></div>
        <div class="note" id="aNote"></div>
        <div class="memo" id="aMemo"></div>
        <div class="others" id="aOthers"></div>
      </div>
    </div>

    <div id="phaseAsk">
      <button id="hintBtn">ヒント</button>
      <div class="row">
        <button id="dunno" class="ng">わからない</button>
        <button id="know" class="primary">わかる</button>
      </div>
    </div>
    <div id="phaseCheck" hidden>
      <p class="hint">思い浮かべた意味と比べて</p>
      <div class="row">
        <button data-grade="0" class="ng">違った</button>
        <button data-grade="1">あいまい</button>
        <button data-grade="2" class="ok">合ってた</button>
      </div>
    </div>
    <div id="phaseNext" hidden>
      <button id="nextBtn" class="primary">次へ</button>
    </div>
    <div id="toast"></div>
  </section>

  <section id="result" hidden>
    <h2>おつかれさまでした</h2>
    <div class="stats">
      <div><span id="rNg">0</span><small>だめ</small></div>
      <div><span id="rMid">0</span><small>あやしい</small></div>
      <div><span id="rOk">0</span><small>OK</small></div>
    </div>
    <button class="primary" id="toHome">ホームへ</button>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
